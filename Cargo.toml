[workspace]
members = [
    "crates/oxabl",
    "crates/oxabl_parser",
    "crates/oxabl_lexer",
    "crates/oxabl_common",
    "crates/oxabl_codegen",
    "crates/oxabl_ast",
    "crates/oxabl_workspace",
    "crates/oxabl_preprocessor",
    "crates/oxabl_schema",
    "crates/oxabl_semantic",
    "crates/oxabl_index",
    "crates/oxabl_lint",
    "crates/oxabl_analyze",
    "crates/oxabl_pipeline",
    "crates/oxabl_style",
    "crates/oxabl_daemon",
    "crates/oxabl_daemon_protocol",
    "crates/oxabl_lsp",
    "crates/oxabl_formatter",
    "crates/oxabl_wasm",
    "crates/oxabl_flow",
    "crates/oxabl_handles",
    "crates/oxabl_scope",
    "crates/oxabl_effects",
    "crates/oxabl_nulls",
    "crates/oxabl_build",
    "crates/oxabl_build_remote",
    "crates/oxabl_fake_avm",
    "crates/oxabl_bench",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
oxabl-cache-client = "0.2.0"

# The oxabl-cache server, admin and member binaries the remote-cache tests run
# against: the revision the client above was published from.
[workspace.metadata.oxabl-cache]
binaries-rev = "0adaa4899993205d48ba994799ed21b59d0529f9"

# Target TigerStyle lint set (see docs/TIGER_STYLE.md). Crates opt in with
# `[lints] workspace = true` once their findings reach zero under
# `cargo xtask tigerstyle`.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "warn"
let_underscore_must_use = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
disallowed_methods = "deny"
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
large_types_passed_by_value = "warn"
fn_params_excessive_bools = "warn"
collapsible_if = "allow"
collapsible_else_if = "allow"
