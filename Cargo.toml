[workspace]
members = [
    "crates/oxabl",
    "crates/oxabl_parser",
    "crates/oxabl_lexer",
    "crates/oxabl_common",
    "crates/oxabl_codegen",
    "crates/oxabl_ast",
    "crates/oxabl_workspace",
    "crates/oxabl_preprocessor",
    "crates/oxabl_schema",
    "crates/oxabl_semantic",
    "crates/oxabl_index",
    "crates/oxabl_lint",
    "crates/oxabl_analyze",
    "crates/oxabl_pipeline",
    "crates/oxabl_style",
    "crates/oxabl_daemon",
    "crates/oxabl_daemon_protocol",
    "crates/oxabl_lsp",
    "crates/oxabl_formatter",
    "crates/oxabl_wasm",
    "crates/oxabl_flow",
    "crates/oxabl_handles",
    "crates/oxabl_scope",
    "crates/oxabl_effects",
    "crates/oxabl_nulls",
    "crates/oxabl_build",
    "crates/oxabl_build_remote",
    "crates/oxabl_fake_avm",
]
resolver = "2"

# The oxabl-cache crates, pinned to one revision. The client is the one that the
# product needs; a crates.io version replaces its line when the client is
# published. The other two serve the black-box tests that set up a roster.
[workspace.dependencies]
oxabl-cache-client = { git = "https://github.com/oxabl-project/oxabl-cache", rev = "053dae48c1fa2101aaa9c9d7442429f5e3c4fd18" }
oxabl-cache-crypto = { git = "https://github.com/oxabl-project/oxabl-cache", rev = "053dae48c1fa2101aaa9c9d7442429f5e3c4fd18" }
oxabl-cache-format = { git = "https://github.com/oxabl-project/oxabl-cache", rev = "053dae48c1fa2101aaa9c9d7442429f5e3c4fd18" }
