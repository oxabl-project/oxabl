name: CI

on:
  push:
    branches: [master]
  # Unfiltered: every PR gets the full suite, including stacked PRs whose base
  # is a feature branch rather than master. GitHub runs this against each PR's
  # merge ref and re-runs it when the base branch moves, so a chain member is
  # re-checked as its base rebases.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - run: cargo check --workspace
      # The fake AVM stands in for Progress, so it must not share a codec with oxabl.
      - name: The fake AVM depends on no oxabl crate
        run: |
          if cargo tree -p oxabl_fake_avm --prefix none | tail -n +2 | grep '^oxabl'; then
            echo "oxabl_fake_avm must not depend on an oxabl crate" >&2
            exit 1
          fi
      # The remote cache sits behind the remote-cache feature of the umbrella
      # crate, so that no other build carries the network and crypto stack.
      - name: Only the remote-cache feature reaches the oxabl-cache client
        run: |
          if cargo tree -p oxabl_build --prefix none | grep '^oxabl-cache'; then
            echo "oxabl_build must not depend on an oxabl-cache crate" >&2
            exit 1
          fi
          if cargo tree -p oxabl -e normal,build --prefix none | grep '^oxabl-cache'; then
            echo "oxabl without the remote-cache feature must not depend on an oxabl-cache crate" >&2
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - run: cargo test --workspace

  remote-cache:
    name: Remote cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      # The tests start the real cache server and drive its admin tool and member
      # command line, built at the revision that Cargo.toml pins. The script builds
      # them only when the cached directory does not hold that revision.
      - uses: actions/cache@v4
        with:
          path: ~/oxabl-cache-bin
          key: oxabl-cache-bin-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'scripts/remote-cache-binaries.sh') }}
      - name: Build the cache server, the admin tool and the member command line
        run: ./scripts/remote-cache-binaries.sh ~/oxabl-cache-bin
      - name: Test the remote cache
        run: |
          export OXABL_CACHE_SERVER_BIN="$HOME/oxabl-cache-bin/bin/oxabl-cache-server"
          export OXABL_CACHE_ADMIN_BIN="$HOME/oxabl-cache-bin/bin/oxabl-cache-admin"
          export OXABL_CACHE_BIN="$HOME/oxabl-cache-bin/bin/oxabl-cache"
          cargo test -p oxabl --features remote-cache --locked \
            --test build_remote_cache --test build_remote_faults --test build_remote_trust

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  wasm:
    name: WebAssembly client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-unknown-unknown
      - run: cargo build -p oxabl_wasm --target wasm32-unknown-unknown --release

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      # The VS Code client's oxabl.toml JSON Schema is generated from the Rust
      # config structs. Regenerate it and fail if the committed copy has drifted.
      - name: Regenerate schema
        run: cargo run -p oxabl -- schema > clients/vscode/schemas/oxabl.schema.json
      - name: Assert no drift
        run: git diff --exit-code -- clients/vscode/schemas/oxabl.schema.json

  vscode-client:
    name: VS Code client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v6
      # Node must be set up BEFORE pnpm/action-setup: action-setup runs pnpm
      # under the ambient Node, and pnpm 11 requires Node >= 22.13. This matches
      # the dev toolchain (Node 22 + pnpm 11).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
