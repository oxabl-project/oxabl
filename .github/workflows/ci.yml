name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - run: cargo test --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      # The VS Code client's oxabl.toml JSON Schema is generated from the Rust
      # config structs. Regenerate it and fail if the committed copy has drifted.
      - name: Regenerate schema
        run: cargo run -p oxabl -- schema > clients/vscode/schemas/oxabl.schema.json
      - name: Assert no drift
        run: git diff --exit-code -- clients/vscode/schemas/oxabl.schema.json

  vscode-client:
    name: VS Code client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: clients/vscode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
