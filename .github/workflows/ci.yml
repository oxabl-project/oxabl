name: CI

on:
  push:
    branches: [master]
  # Unfiltered: every PR gets the full suite, including stacked PRs whose base
  # is a feature branch rather than master. GitHub runs this against each PR's
  # merge ref and re-runs it when the base branch moves, so a chain member is
  # re-checked as its base rebases.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - run: cargo check --workspace
      # The fake AVM stands in for Progress, so it must not share a codec with oxabl.
      - name: The fake AVM depends on no oxabl crate
        run: |
          if cargo tree -p oxabl_fake_avm --prefix none | tail -n +2 | grep '^oxabl'; then
            echo "oxabl_fake_avm must not depend on an oxabl crate" >&2
            exit 1
          fi
      # The remote cache sits behind the remote-cache feature of the umbrella
      # crate, so that no other build carries the network and crypto stack.
      - name: Only the remote-cache feature reaches the oxabl-cache client
        run: |
          if cargo tree -p oxabl_build --prefix none | grep '^oxabl-cache'; then
            echo "oxabl_build must not depend on an oxabl-cache crate" >&2
            exit 1
          fi
          if cargo tree -p oxabl -e normal,build --prefix none | grep '^oxabl-cache'; then
            echo "oxabl without the remote-cache feature must not depend on an oxabl-cache crate" >&2
            exit 1
          fi
      # The self-update feature of the umbrella crate is the only way to the HTTP
      # and TLS stack besides the remote cache, so a plain `cargo install oxabl`
      # carries no network or crypto code.
      - name: Only the self-update and remote-cache features reach the network stack
        run: |
          pattern='^(reqwest|hyper|hyper-rustls|hyper-util|rustls|rustls-webpki|tokio|tokio-rustls|ring|aws-lc-rs|aws-lc-sys) '
          if cargo tree -p oxabl -e normal,build --prefix none | grep -E "$pattern"; then
            echo "oxabl without the self-update and remote-cache features must not depend on an HTTP or TLS crate" >&2
            exit 1
          fi
          if cargo tree -p oxabl_build -e normal,build --prefix none | grep -E "$pattern"; then
            echo "oxabl_build must not depend on an HTTP or TLS crate" >&2
            exit 1
          fi
          # Positive control: the check above would pass for any pattern.
          cargo tree -p oxabl --features self-update -e normal,build --prefix none | grep -Eq '^reqwest '

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - run: cargo test --workspace

  remote-cache:
    name: Remote cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      # The tests start the real cache server and drive its admin tool and member
      # command line, built at the revision that Cargo.toml pins. The script builds
      # them only when the cached directory does not hold that revision.
      - uses: actions/cache@v4
        with:
          path: ~/oxabl-cache-bin
          key: oxabl-cache-bin-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'scripts/remote-cache-binaries.sh') }}
      - name: Build the cache server, the admin tool and the member command line
        run: ./scripts/remote-cache-binaries.sh ~/oxabl-cache-bin
      - name: Test the remote cache
        run: |
          export OXABL_CACHE_SERVER_BIN="$HOME/oxabl-cache-bin/bin/oxabl-cache-server"
          export OXABL_CACHE_ADMIN_BIN="$HOME/oxabl-cache-bin/bin/oxabl-cache-admin"
          export OXABL_CACHE_BIN="$HOME/oxabl-cache-bin/bin/oxabl-cache"
          cargo test -p oxabl --features remote-cache --locked \
            --test build_remote_cache --test build_remote_faults --test build_remote_trust \
            --test build_remote_fetch_volume --test build_remote_fetch_tree

  self-update:
    name: Self-update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      # The tests copy the built binary and update the copy from a fake GitHub
      # on a loopback port.
      - run: cargo test -p oxabl --features self-update --locked --test self_update
      - run: cargo clippy -p oxabl --all-targets --features remote-cache,self-update --locked -- -D warnings

  install-script:
    name: Install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - run: shellcheck scripts/install.sh
      # The tests run the script against a fake GitHub on a loopback port. dash
      # is /bin/sh on Ubuntu, so this runs the script as a plain POSIX shell.
      - name: Run the script with dash
        run: OXABL_TEST_SH=/bin/dash cargo test -p oxabl --locked --test install_script
      - name: Run the script with bash
        run: OXABL_TEST_SH=/bin/bash cargo test -p oxabl --locked --test install_script

  musl-binary:
    name: Static Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oxabl-musl
          key: oxabl-musl-${{ hashFiles('Cargo.lock', 'scripts/build-musl.sh') }}
          restore-keys: oxabl-musl-
      # The release workflow publishes this binary. A change that breaks the static
      # build fails here, before a release. The binary must start in the usual
      # OpenEdge image (glibc 2.35) and must not need a shared library.
      - run: ./scripts/build-musl.sh dist
        env:
          OXABL_MUSL_CACHE: ${{ runner.temp }}/oxabl-musl
      - run: ./scripts/check-musl.sh dist/oxabl-x86_64-unknown-linux-musl

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  fuzz-targets:
    name: Fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          components: clippy, rustfmt
      # The cargo-fuzz targets are outside the workspace, so the jobs above do not
      # build them. This keeps them compiling; running them needs nightly and
      # cargo-fuzz (fuzz/README.md).
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

  wasm:
    name: WebAssembly client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          targets: wasm32-unknown-unknown
      - run: cargo build -p oxabl_wasm --target wasm32-unknown-unknown --release

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      # The VS Code client's oxabl.toml JSON Schema is generated from the Rust
      # config structs. Regenerate it and fail if the committed copy has drifted.
      - name: Regenerate schema
        run: cargo run -p oxabl -- schema > clients/vscode/schemas/oxabl.schema.json
      - name: Assert no drift
        run: git diff --exit-code -- clients/vscode/schemas/oxabl.schema.json

  grammar-drift:
    name: Grammar drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      # The extension's TextMate grammar is generated from
      # resources/abl.tmLanguage.template.json and the keyword data. Regenerate
      # it and fail if the committed copy has drifted.
      - name: Regenerate grammar
        run: cargo run -p oxabl_codegen -- grammar
      - name: Assert no drift
        run: git diff --exit-code -- clients/vscode/syntaxes/

  vscode-client:
    name: VS Code client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v6
      # Node must be set up BEFORE pnpm/action-setup: action-setup runs pnpm
      # under the ambient Node, and pnpm 11 requires Node >= 22.13. This matches
      # the dev toolchain (Node 22 + pnpm 11).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Test
        run: pnpm test
      - name: Grammar tests
        run: pnpm run test:grammar
      # The release workflow publishes the VSIX this script builds.
      - name: Package
        run: bash scripts/package-vsix.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: oxabl-vscode-vsix
          path: clients/vscode/dist/
          if-no-files-found: error

  vscode-e2e:
    name: VS Code end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      # The suite downloads the VS Code version pinned in test/e2e/lib/vscode.mjs.
      - uses: actions/cache@v4
        with:
          path: clients/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('clients/vscode/test/e2e/lib/vscode.mjs') }}
      # The packaged VSIX in a real VS Code: highlighting, the Markdown
      # injection, the missing-binary warning and the self-update against a
      # fake GitHub API.
      - run: xvfb-run -a pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-e2e-screenshots
          path: clients/vscode/test/e2e/screenshots/
          if-no-files-found: ignore
