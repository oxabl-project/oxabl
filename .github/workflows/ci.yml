name: CI


# When master or a PR branch gets a new push, cancel the CI run of the earlier push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  # Unfiltered: every PR gets the full suite, including stacked PRs whose base
  # is a feature branch rather than master. GitHub runs this against each PR's
  # merge ref and re-runs it when the base branch moves, so a chain member is
  # re-checked as its base rebases.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # This job alone saves the registry, after fetching every dependency.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          save-registry: true
      # The steps are in xtask/src/jobs.rs.
      - run: cargo xtask ci check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo xtask ci test

  remote-cache:
    name: Remote cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      # The tests start the real cache server and drive its admin tool and member
      # command line, built at the revision that Cargo.toml pins. The job builds
      # them only when the cached directory does not hold that revision.
      - uses: actions/cache@v6
        with:
          path: ~/oxabl-cache-bin
          key: oxabl-cache-bin-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'scripts/remote-cache-binaries.sh') }}
      - run: cargo xtask ci remote-cache

  self-update:
    name: Self-update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
      # The tests copy the built binary and update the copy from a fake GitHub
      # on a loopback port.
      - run: cargo xtask ci self-update

  install-script:
    name: Install script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo xtask ci install-script

  musl-binary:
    name: Static Linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oxabl-musl
          key: oxabl-musl-${{ hashFiles('Cargo.lock', 'scripts/build-musl.sh') }}
          restore-keys: oxabl-musl-
      # The release workflow publishes this binary. A change that breaks the static
      # build fails here, before a release.
      - run: cargo xtask ci musl-binary
        env:
          OXABL_MUSL_CACHE: ${{ runner.temp }}/oxabl-musl

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo xtask ci fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
      - run: cargo xtask ci clippy

  fuzz-targets:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy, rustfmt
      # The cargo-fuzz targets are outside the workspace, so the jobs above do not
      # build them. This keeps them compiling; running them needs nightly and
      # cargo-fuzz (fuzz/README.md).
      - run: cargo xtask ci fuzz-targets

  wasm:
    name: WebAssembly client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo xtask ci wasm

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      # The VS Code client's oxabl.toml JSON Schema is generated from the Rust
      # config structs. The job regenerates it and fails if the committed copy has drifted.
      - run: cargo xtask ci schema-drift

  grammar-drift:
    name: Grammar drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      # The grammar, the keyword docs and the completion snippets are generated.
      # The job regenerates each and fails if a committed copy has drifted.
      - run: cargo xtask ci grammar-drift

  vscode-client:
    name: VS Code client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Node must be set up BEFORE pnpm/action-setup: action-setup runs pnpm
      # under the ambient Node, and pnpm 11 requires Node >= 22.13. This matches
      # the dev toolchain (Node 22 + pnpm 11).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: cargo xtask ci vscode-client
      - uses: actions/upload-artifact@v4
        with:
          name: oxabl-vscode-vsix
          path: clients/vscode/dist/
          if-no-files-found: error

  vscode-e2e:
    name: VS Code end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      # Node must be set up BEFORE pnpm/action-setup: action-setup runs pnpm
      # under the ambient Node, and pnpm 11 requires Node >= 22.13. This matches
      # the dev toolchain (Node 22 + pnpm 11).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # The suite downloads the VS Code version pinned in test/e2e/lib/vscode.mjs.
      - uses: actions/cache@v6
        with:
          path: clients/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('clients/vscode/test/e2e/lib/vscode.mjs') }}
      # The job builds oxabl (the outline scenario runs the real language server), then
      # runs the packaged VSIX in a real VS Code.
      - run: cargo xtask ci vscode-e2e
        env:
          OXABL_E2E_RUNTIME: /tmp/oxrt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-e2e-screenshots
          path: clients/vscode/test/e2e/screenshots/
          if-no-files-found: ignore
