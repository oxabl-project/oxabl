[package]
name = "oxabl_codegen"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Code generation tool for Oxabl lexer keywords and atoms"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_codegen"

[[bin]]
name = "oxabl-codegen"
path = "src/main.rs"

[dependencies]
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
