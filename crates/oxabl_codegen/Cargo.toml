[package]
name = "oxabl_codegen"
version = "0.10.0"
edition = "2024"
license = "MIT"
description = "Code generation tool for Oxabl lexer keywords and atoms"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_codegen"

[[bin]]
name = "oxabl-codegen"
path = "src/main.rs"

[dependencies]
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = "3"

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
