[package]
name = "oxabl_common"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Shared utilities for the Oxabl ABL tooling suite"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_common"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "1.0.0" }
serde = { version = "1", optional = true, features = ["derive"] }

[features]
# Opt-in `Serialize` on the diagnostic family (`Diagnostic`, `Severity`,
# `FileSpan`, `FileId`, `DiagnosticCode`, `Label`). Pulls `oxabl_ast/serde`
# because `FileSpan` embeds a `Span`.
serde = ["dep:serde", "oxabl_ast/serde"]
# Test-only: arms the `panic_if_injected` seam so a source carrying an
# `OXABL-TEST-PANIC:<site>` marker panics at that guarded call site. Enabled
# only through dev-dependencies (see `oxabl` and `oxabl_lsp`), so it is never on
# in a real build. No ABL input panics today, so this is the only way to test
# that the guards contain a panic.
test-panics = []

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
serde_json = "1"

[[bench]]
name = "source_map_bench"
harness = false
