[package]
name = "oxabl_common"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Shared utilities for the Oxabl ABL tooling suite"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_common"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "0.5.0" }
serde = { version = "1", optional = true, features = ["derive"] }

[features]
# Opt-in `Serialize` on the diagnostic family (`Diagnostic`, `Severity`,
# `FileSpan`, `FileId`, `DiagnosticCode`, `Label`). Pulls `oxabl_ast/serde`
# because `FileSpan` embeds a `Span`.
serde = ["dep:serde", "oxabl_ast/serde"]

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
serde_json = "1"

[[bench]]
name = "source_map_bench"
harness = false
