[package]
name = "oxabl_effects"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Database effects per unit, likely index per record read, and transitive summaries over the call graph, for Progress ABL"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_effects"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "4.0.0" }
oxabl_flow = { path = "../oxabl_flow", version = "0.3.4" }
oxabl_index = { path = "../oxabl_index", version = "5.0.1" }
oxabl_lexer = { path = "../oxabl_lexer", version = "2.0.1" }
oxabl_schema = { path = "../oxabl_schema", version = "0.4.4" }
oxabl_scope = { path = "../oxabl_scope", version = "0.2.4" }
rustc-hash = "2"

[dev-dependencies]
oxabl_parser = { path = "../oxabl_parser", version = "4.0.1" }
oxabl_schema = { path = "../oxabl_schema", version = "0.4.4", features = ["test-support"] }
