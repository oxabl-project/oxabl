[package]
name = "oxabl_handles"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Lifetimes of dynamic objects (handles, persistent procedures, MEMPTRs) per unit, for Progress ABL"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_handles"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "8.0.0" }
oxabl_flow = { path = "../oxabl_flow", version = "0.6.0" }
oxabl_lexer = { path = "../oxabl_lexer", version = "4.0.0" }
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }

[dev-dependencies]
oxabl_parser = { path = "../oxabl_parser", version = "7.0.0" }

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
