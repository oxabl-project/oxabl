    -> n7 raise(stop)
    -> n8 normal
  n6 handler(error) b0
    -> n0 retry
  n7 handler(stop) b1
    -> n11 leave
  n8 stmt b1 5:5 `RUN slow.p.`
    -> n6 raise(error)
    -> n7 raise(stop)
    -> n9 normal
  n9 stmt b1 6:5 `DELETE OBJECT h.`
    -> n6 raise(error)
    -> n7 raise(stop)
    -> n10 normal
  n10 end b1
    -> n11 normal
  n11 after(b1) b0
    -> n12 normal
  n12 head b2 8:1 `DO STOP-AFTER 5:`
    -> n13 normal
  n13 stmt b2 9:5 `i = 1.`
    -> n6 raise(error)
    -> n14 raise(stop)
    -> n15 normal
  n14 exit(stop) b0
  n15 end b2
    -> n16 normal
  n16 after(b2) b0
    -> n17 normal
  n17 head b3 11:1 `DO ON STOP UNDO, LEAVE:`
    -> n18 normal
  n18 stmt b3 12:5 `RUN other.p.`
    -> n6 raise(error)
    -> n19 raise(stop)
    -> n20 normal
  n19 handler(stop) b3
    -> n35 leave
  n20 stmt b3 13:5 `FIND FIRST Customer.`
    -> n6 raise(error)
    -> n19 raise(stop)
    -> n21 normal
  n21 stmt b3 14:5 `FIND FIRST Customer NO-LOCK.`
    -> n6 raise(error)
    -> n22 normal
  n22 head b4 15:5 `FOR EACH Customer EXCLUSIVE-LOCK:`
    -> n23 raise(error)
    -> n19 raise(stop)
    -> n24 loop-done
    -> n25 loop-body
  n23 handler(error) b4
    -> n26 next
  n24 after(b4) b3
    -> n27 normal
  n25 stmt b4 16:9 `i = 2.`
    -> n23 raise(error)
    -> n26 normal
  n26 end b4
    -> n22 loop-back
  n27 head b5 18:5 `FOR EACH Customer NO-LOCK:`
    -> n28 raise(error)
    -> n29 loop-done
    -> n30 loop-body
  n28 handler(error) b5
    -> n31 next
  n29 after(b5) b3
    -> n32 normal
  n30 stmt b5 19:9 `i = 3.`
    -> n28 raise(error)
    -> n31 normal
  n31 end b5
    -> n27 loop-back
  n32 stmt b3 21:5 `WAIT-FOR CLOSE OF THIS-PROCEDURE.`
    -> n6 raise(error)
    -> n33 raise(endkey)
    -> n19 raise(stop)
    -> n34 normal
  n33 handler(endkey) b0
    -> n1 leave
  n34 end b3
    -> n35 normal
  n35 after(b3) b0
    -> n36 normal
  n36 stmt b0 23:1 `RUN other.p.`
    -> n6 raise(error)
    -> n37 normal
  n37 stmt b0 24:1 `FIND FIRST Customer.`
    -> n6 raise(error)
    -> n38 normal
  n38 head b6 25:1 `DO STOP-AFTER 5 ON STOP UNDO, LEAVE:`
    -> n39 normal
  n39 stmt b6 26:5 `RUN slow.p.`
    -> n40 raise(error)
    -> n43 raise(stop)
    -> n44 normal
  n40 head b7 27:5 `FINALLY:`
    -> n41 normal
  n41 stmt b7 28:9 `i = 4.`
    -> n6 raise(error)
    -> n42 normal
  n42 end b7
    -> n6 raise(error)
  n43 handler(stop) b6
    -> n46 leave
  n44 end b6
    -> n49 normal
  n45 after(b6) b0
    -> n52 normal
  n46 head b7 27:5 `FINALLY:`
    -> n47 normal
  n47 stmt b7 28:9 `i = 4.`
    -> n6 raise(error)
    -> n48 normal
  n48 end b7
    -> n45 leave
  n49 head b7 27:5 `FINALLY:`
    -> n50 normal
  n50 stmt b7 28:9 `i = 4.`
    -> n6 raise(error)
    -> n51 normal
  n51 end b7
    -> n45 normal
  n52 end b0
    -> n1 normal
