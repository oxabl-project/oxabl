unit u0 main
  b0 main @1:1 input
    on error: UNDO, RETRY (default) => retry
    on endkey: UNDO, LEAVE (default)
  b1 do @3:1 parent=b0 stop-after
    on stop: UNDO, LEAVE (phrase)
  b2 do @8:1 parent=b0 stop-after
  b3 do @11:1 parent=b0 input
    on stop: UNDO, LEAVE (phrase)
  b4 for-each @15:5 parent=b3 iterating buffers=Customer
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b5 for-each @18:5 parent=b3 iterating buffers=Customer
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b6 do @25:1 parent=b0 stop-after
    on stop: UNDO, LEAVE (phrase)
  b7 finally @27:5 parent=b6
    on error: UNDO, THROW (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE h AS HANDLE NO-UNDO.`
    -> n3 normal
  n3 stmt b0 2:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
