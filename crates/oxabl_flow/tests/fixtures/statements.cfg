unit u0 main
  b0 main @1:1 input
    on error: UNDO, RETRY (default) => retry
    on endkey: UNDO, LEAVE (default)
  b1 repeat @2:1 parent=b0 iterating input
    on error: UNDO, RETRY (default) => retry
    on endkey: UNDO, LEAVE (default)
  b2 for-each @8:1 parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `REPEAT:`
    -> n4 loop-body
  n4 stmt b1 3:5 `UPDATE i.` opaque=skipped-statement
    -> n5 raise(error)
    -> n6 raise(endkey)
    -> n7 normal
  n5 handler(error) b1
    -> n3 retry
  n6 handler(endkey) b1
    -> n11 leave
  n7 stmt b1 4:5 `IF i = 0 THEN`
    -> n5 raise(error)
    -> n8 true
    -> n9 false
  n8 stmt b1 4:19 `UNDO, RETRY.`
    -> n3 retry
  n9 stmt b1 5:5 `IF i = 1 THEN`
    -> n5 raise(error)
    -> n10 true
    -> n12 false
  n10 stmt b1 5:19 `UNDO, LEAVE.`
    -> n11 leave
  n11 after(b1) b0
    -> n15 normal
  n12 stmt b1 6:5 `IF i = 2 THEN`
    -> n5 raise(error)
    -> n13 true
    -> n14 false
  n13 stmt b1 6:19 `UNDO.`
    -> n3 retry
  n14 end b1
    -> n3 loop-back
  n15 head b2 8:1 `FOR EACH Customer NO-LOCK:`
    -> n16 raise(error)
    -> n17 loop-done
    -> n18 loop-body
  n16 handler(error) b2
    -> n20 next
  n17 after(b2) b0
    -> n21 normal
  n18 stmt b2 9:5 `IF i = 3 THEN`
    -> n16 raise(error)
    -> n19 true
    -> n20 false
  n19 stmt b2 9:19 `UNDO, NEXT.`
    -> n20 next
  n20 end b2
    -> n15 loop-back
  n21 stmt b0 11:1 `IF i = 4 THEN`
    -> n22 raise(error)
    -> n23 true
    -> n25 false
  n22 handler(error) b0
    -> n0 retry
  n23 stmt b0 11:15 `QUIT.`
    -> n24 raise(quit)
  n24 exit(quit) b0
  n25 stmt b0 12:1 `FIND FIRST Customer NO-LOCK NO-ERROR.`
    -> n26 normal
  n26 stmt b0 13:1 `RUN other.p NO-ERROR.`
    -> n27 normal
  n27 stmt b0 14:1 `ASSIGN i = 5 NO-ERROR.`
    -> n28 normal
  n28 stmt b0 15:1 `PUT UNFORMATTED "x" SKIP.` opaque=skipped-statement
    -> n22 raise(error)
    -> n29 normal
  n29 stmt b0 16:1 `OPEN QUERY q FOR EACH Customer NO-LOCK.` opaque=skipped-statement
    -> n22 raise(error)
    -> n30 normal
  n30 stmt b0 17:1 `{missing.i}` opaque=unexpanded-include
    -> n22 raise(error)
    -> n31 normal
  n31 stmt b0 18:1 `@Strict.Owns.`
    -> n32 normal
  n32 stmt b0 19:1 `RUN other.p.`
    -> n22 raise(error)
    -> n33 normal
  n33 end b0
    -> n1 normal
