unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 do @4:6 parent=b0
  b2 do @10:27 parent=b0
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE x AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 stmt b0 2:1 `IF x > 1 THEN`
    -> n4 raise(error)
    -> n5 true
    -> n6 false
  n4 handler(error) b0
    -> n1 leave
  n5 stmt b0 3:5 `x = 2.`
    -> n4 raise(error)
    -> n10 normal
  n6 head b1 4:6 `DO:`
    -> n7 normal
  n7 stmt b1 5:5 `x = 3.`
    -> n4 raise(error)
    -> n8 normal
  n8 end b1
    -> n9 normal
  n9 after(b1) b0
    -> n10 normal
  n10 stmt b0 7:1 `IF x = 0 THEN`
    -> n4 raise(error)
    -> n11 true
    -> n12 false
  n11 stmt b0 7:15 `x = 1.`
    -> n4 raise(error)
    -> n12 normal
  n12 stmt b0 8:1 `CASE x:`
    -> n4 raise(error)
    -> n13 when(0)
    -> n14 when(1)
    -> n18 otherwise
  n13 stmt b0 9:17 `x = 10.`
    -> n4 raise(error)
    -> n19 normal
  n14 head b2 10:27 `DO:`
    -> n15 normal
  n15 stmt b2 11:9 `x = 20.`
    -> n4 raise(error)
    -> n16 normal
  n16 end b2
    -> n17 normal
  n17 after(b2) b0
    -> n19 normal
  n18 stmt b0 13:15 `x = 0.`
    -> n4 raise(error)
    -> n19 normal
  n19 stmt b0 15:1 `CASE x:`
    -> n4 raise(error)
    -> n20 when(0)
    -> n21 otherwise
  n20 stmt b0 16:17 `RETURN.`
    -> n1 return
  n21 stmt b0 18:1 `RETURN.`
    -> n1 return
  n22 stmt b0 19:1 `x = 99.`
    -> n4 raise(error)
    -> n23 normal
  n23 end b0
    -> n1 normal
