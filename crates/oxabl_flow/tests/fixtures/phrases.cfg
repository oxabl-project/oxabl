unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 do @2:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b2 for-each @5:1 parent=b0 iterating buffers=Customer
    on error: UNDO, NEXT (phrase)
    on endkey: UNDO, LEAVE (default)
  b3 do @8:1 parent=b0 transaction
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b4 do @11:1 parent=b0
  b5 repeat @15:1 label=outer parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO outer, LEAVE outer (phrase)
  b6 do @16:5 parent=b5
    on error: UNDO outer, RETRY outer (phrase)
  b7 do @21:1 parent=b0
    on stop: UNDO, RETURN ERROR (phrase)
    on quit: UNDO, LEAVE (phrase)
  b8 do @24:1 parent=b0
    on error: UNDO, THROW (phrase)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `DO ON ERROR UNDO, LEAVE:`
    -> n4 normal
  n4 stmt b1 3:5 `i = 1.`
    -> n5 raise(error)
    -> n6 normal
  n5 handler(error) b1
    -> n7 leave
  n6 end b1
    -> n7 normal
  n7 after(b1) b0
    -> n8 normal
  n8 head b2 5:1 `FOR EACH Customer NO-LOCK ON ERROR UNDO, NEXT:`
    -> n9 raise(error)
    -> n10 loop-done
    -> n11 loop-body
  n9 handler(error) b2
    -> n12 next
  n10 after(b2) b0
    -> n13 normal
  n11 stmt b2 6:5 `i = 2.`
    -> n9 raise(error)
    -> n12 normal
  n12 end b2
    -> n8 loop-back
  n13 head b3 8:1 `DO TRANSACTION:`
    -> n14 normal
  n14 stmt b3 9:5 `i = 3.`
    -> n15 raise(error)
    -> n16 normal
  n15 handler(error) b3
    -> n17 leave
  n16 end b3
    -> n17 normal
  n17 after(b3) b0
    -> n18 normal
  n18 head b4 11:1 `DO:`
    -> n19 normal
  n19 stmt b4 12:5 `i = 4.`
    -> n20 raise(error)
    -> n21 normal
  n20 handler(error) b0
    -> n1 leave
  n21 end b4
    -> n22 normal
  n22 after(b4) b0
    -> n23 normal
  n23 head b5 15:1 `REPEAT ON ENDKEY UNDO outer, LEAVE outer:`
    -> n24 loop-body
  n24 head b6 16:5 `DO ON ERROR UNDO outer, RETRY outer:`
    -> n25 normal
  n25 stmt b6 17:9 `i = 5.`
    -> n26 raise(error)
    -> n27 normal
  n26 handler(error) b6
    -> n28 next
  n27 end b6
    -> n29 normal
  n28 end b5
    -> n23 loop-back
  n29 after(b6) b5
    -> n30 normal
  n30 stmt b5 19:5 `IF i > 5 THEN`
    -> n31 raise(error)
    -> n32 true
    -> n28 false
  n31 handler(error) b5
    -> n28 next
  n32 stmt b5 19:19 `LEAVE.`
    -> n33 leave
  n33 after(b5) b0
    -> n34 normal
  n34 head b7 21:1 `DO ON STOP UNDO, RETURN ERROR ON QUIT UNDO, L...`
    -> n35 normal
  n35 stmt b7 22:5 `STOP.`
    -> n36 raise(stop)
  n36 handler(stop) b7
    -> n37 return-error
  n37 exit(error) b0
  n38 head b8 24:1 `DO ON ERROR UNDO, THROW:`
    -> n39 normal
  n39 stmt b8 25:5 `i = 6.`
    -> n40 raise(error)
    -> n41 normal
  n40 handler(error) b8
    -> n20 throw
  n41 end b8
    -> n42 normal
  n42 after(b8) b0
    -> n43 normal
  n43 end b0
    -> n1 normal
