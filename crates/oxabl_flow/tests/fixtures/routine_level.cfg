directive routine-level
unit u0 main
  b0 main @1:1
    on error: UNDO, THROW (routine-level)
    on endkey: UNDO, LEAVE (default)
  b1 for-each @4:1 parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `ROUTINE-LEVEL ON ERROR UNDO, THROW.`
    -> n3 normal
  n3 stmt b0 2:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n4 normal
  n4 stmt b0 3:1 `i = 1.`
    -> n5 raise(error)
    -> n6 normal
  n5 handler(error) b0
    -> n12 throw
  n6 head b1 4:1 `FOR EACH Customer NO-LOCK:`
    -> n7 raise(error)
    -> n8 loop-done
    -> n9 loop-body
  n7 handler(error) b1
    -> n10 next
  n8 after(b1) b0
    -> n11 normal
  n9 stmt b1 5:5 `i = 2.`
    -> n7 raise(error)
    -> n10 normal
  n10 end b1
    -> n6 loop-back
  n11 end b0
    -> n1 normal
  n12 exit(error) b0
unit u1 procedure p parent=u0
  b0 procedure @7:1
    on error: UNDO, THROW (routine-level)
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 8:5 `i = 3.`
    -> n3 raise(error)
    -> n4 normal
  n3 handler(error) b0
    -> n5 throw
  n4 end b0
    -> n1 normal
  n5 exit(error) b0
