unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 for-each @3:1 label=outer parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b2 do @5:5 label=inner parent=b1 iterating
  b3 do @13:1 label=blk parent=b0
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 3:1 `FOR EACH Customer NO-LOCK:`
    -> n4 raise(error)
    -> n5 loop-done
    -> n6 loop-body
  n4 handler(error) b1
    -> n10 next
  n5 after(b1) b0
    -> n16 normal
  n6 head b2 5:5 `DO i = 1 TO 3:`
    -> n4 raise(error)
    -> n7 loop-done
    -> n8 loop-body
  n7 after(b2) b1
    -> n10 normal
  n8 stmt b2 6:9 `IF i = 1 THEN`
    -> n4 raise(error)
    -> n9 true
    -> n11 false
  n9 stmt b2 6:23 `NEXT outer.`
    -> n10 next
  n10 end b1
    -> n3 loop-back
  n11 stmt b2 7:9 `IF i = 2 THEN`
    -> n4 raise(error)
    -> n12 true
    -> n13 false
  n12 stmt b2 7:23 `LEAVE outer.`
    -> n5 leave
  n13 stmt b2 8:9 `IF i = 3 THEN`
    -> n4 raise(error)
    -> n14 true
    -> n15 false
  n14 stmt b2 8:23 `LEAVE inner.`
    -> n7 leave
  n15 stmt b2 9:9 `LEAVE nowhere.` opaque=unresolved-label
    -> n7 leave
  n16 head b3 13:1 `DO:`
    -> n17 normal
  n17 stmt b3 14:5 `LEAVE blk.`
    -> n18 leave
  n18 after(b3) b0
    -> n19 normal
  n19 end b0
    -> n1 normal
