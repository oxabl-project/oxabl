directive block-level
unit u0 main
  b0 main @1:1
    on error: UNDO, THROW (block-level)
    on endkey: UNDO, LEAVE (default)
  b1 for-each @3:1 parent=b0 iterating buffers=Customer
    on error: UNDO, THROW (block-level)
    on endkey: UNDO, LEAVE (default)
  b2 do @6:1 parent=b0
  b3 do @9:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `BLOCK-LEVEL ON ERROR UNDO, THROW.`
    -> n3 normal
  n3 stmt b0 2:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n4 normal
  n4 head b1 3:1 `FOR EACH Customer NO-LOCK:`
    -> n5 raise(error)
    -> n6 loop-done
    -> n7 loop-body
  n5 handler(error) b1
    -> n9 throw
  n6 after(b1) b0
    -> n10 normal
  n7 stmt b1 4:5 `i = 1.`
    -> n5 raise(error)
    -> n8 normal
  n8 end b1
    -> n4 loop-back
  n9 handler(error) b0
    -> n20 throw
  n10 head b2 6:1 `DO:`
    -> n11 normal
  n11 stmt b2 7:5 `i = 2.`
    -> n9 raise(error)
    -> n12 normal
  n12 end b2
    -> n13 normal
  n13 after(b2) b0
    -> n14 normal
  n14 head b3 9:1 `DO ON ERROR UNDO, LEAVE:`
    -> n15 normal
  n15 stmt b3 10:5 `i = 3.`
    -> n16 raise(error)
    -> n17 normal
  n16 handler(error) b3
    -> n18 leave
  n17 end b3
    -> n18 normal
  n18 after(b3) b0
    -> n19 normal
  n19 end b0
    -> n1 normal
  n20 exit(error) b0
