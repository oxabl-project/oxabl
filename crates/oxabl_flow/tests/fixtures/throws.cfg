unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 do @2:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b2 do @5:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b3 do @8:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b4 do @11:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `DO ON ERROR UNDO, LEAVE:`
    -> n4 normal
  n4 stmt b1 3:5 `THROW NEW Progress.Lang.AppError("a", 1).`
    -> n5 throw
  n5 handler(error) b1
    -> n6 leave
  n6 after(b1) b0
    -> n7 normal
  n7 head b2 5:1 `DO ON ERROR UNDO, LEAVE:`
    -> n8 normal
  n8 stmt b2 6:5 `UNDO, THROW NEW Progress.Lang.AppError("b", 1).` undoes=b2
    -> n9 raise(error)
    -> n10 throw
  n9 handler(error) b2
    -> n11 leave
  n10 handler(error) b0
    -> n1 leave
  n11 after(b2) b0
    -> n12 normal
  n12 head b3 8:1 `DO ON ERROR UNDO, LEAVE:`
    -> n13 normal
  n13 stmt b3 9:5 `IF i = 1 THEN`
    -> n14 raise(error)
    -> n15 true
    -> n17 false
  n14 handler(error) b3
    -> n18 leave
  n15 stmt b3 9:19 `RETURN ERROR "c".`
    -> n16 return-error
  n16 exit(error) b0
  n17 end b3
    -> n18 normal
  n18 after(b3) b0
    -> n19 normal
  n19 head b4 11:1 `DO ON ERROR UNDO, LEAVE:`
    -> n20 normal
  n20 stmt b4 12:5 `IF i = 2 THEN`
    -> n21 raise(error)
    -> n22 true
    -> n23 false
  n21 handler(error) b4
    -> n24 leave
  n22 stmt b4 12:19 `UNDO, RETURN ERROR "d".` undoes=b4
    -> n21 raise(error)
    -> n16 return-error
  n23 end b4
    -> n24 normal
  n24 after(b4) b0
    -> n25 normal
  n25 stmt b0 14:1 `IF i = 0 THEN`
    -> n10 raise(error)
    -> n26 true
    -> n27 false
  n26 stmt b0 14:15 `RETURN ERROR.`
    -> n16 return-error
  n27 end b0
    -> n1 normal
