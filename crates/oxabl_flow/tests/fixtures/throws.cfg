unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 do @2:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b2 do @5:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b3 do @8:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b4 do @11:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `DO ON ERROR UNDO, LEAVE:`
    -> n4 normal
  n4 stmt b1 3:5 `THROW NEW Progress.Lang.AppError("a", 1).`
    -> n5 throw
  n5 handler(error) b1
    -> n6 leave
  n6 after(b1) b0
    -> n7 normal
  n7 head b2 5:1 `DO ON ERROR UNDO, LEAVE:`
    -> n8 normal
  n8 stmt b2 6:5 `UNDO, THROW NEW Progress.Lang.AppError("b", 1).` undoes=b2
    -> n9 throw
  n9 handler(error) b0
    -> n1 leave
  n10 head b3 8:1 `DO ON ERROR UNDO, LEAVE:`
    -> n11 normal
  n11 stmt b3 9:5 `IF i = 1 THEN`
    -> n12 raise(error)
    -> n13 true
    -> n15 false
  n12 handler(error) b3
    -> n16 leave
  n13 stmt b3 9:19 `RETURN ERROR "c".`
    -> n14 return-error
  n14 exit(error) b0
  n15 end b3
    -> n16 normal
  n16 after(b3) b0
    -> n17 normal
  n17 head b4 11:1 `DO ON ERROR UNDO, LEAVE:`
    -> n18 normal
  n18 stmt b4 12:5 `IF i = 2 THEN`
    -> n19 raise(error)
    -> n20 true
    -> n21 false
  n19 handler(error) b4
    -> n22 leave
  n20 stmt b4 12:19 `UNDO, RETURN ERROR "d".` undoes=b4
    -> n14 return-error
  n21 end b4
    -> n22 normal
  n22 after(b4) b0
    -> n23 normal
  n23 stmt b0 14:1 `IF i = 0 THEN`
    -> n9 raise(error)
    -> n24 true
    -> n25 false
  n24 stmt b0 14:15 `RETURN ERROR.`
    -> n14 return-error
  n25 end b0
    -> n1 normal
