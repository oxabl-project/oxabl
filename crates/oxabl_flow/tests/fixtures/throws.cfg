unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 do @2:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b2 do @5:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b3 do @8:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b4 do @11:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `DO ON ERROR UNDO, LEAVE:`
    -> n4 normal
  n4 stmt b1 3:5 `THROW NEW Progress.Lang.AppError("a", 1).`
    -> n5 throw
  n5 handler(error) b1
    -> n6 leave
  n6 after(b1) b0
    -> n7 normal
  n7 head b2 5:1 `DO ON ERROR UNDO, LEAVE:`
    -> n8 normal
  n8 stmt b2 6:5 `UNDO, THROW NEW Progress.Lang.AppError("b", 1).`
    -> n9 throw
  n9 handler(error) b2
    -> n10 leave
  n10 after(b2) b0
    -> n11 normal
  n11 head b3 8:1 `DO ON ERROR UNDO, LEAVE:`
    -> n12 normal
  n12 stmt b3 9:5 `IF i = 1 THEN`
    -> n13 raise(error)
    -> n14 true
    -> n16 false
  n13 handler(error) b3
    -> n17 leave
  n14 stmt b3 9:19 `RETURN ERROR "c".`
    -> n15 return-error
  n15 exit(error) b0
  n16 end b3
    -> n17 normal
  n17 after(b3) b0
    -> n18 normal
  n18 head b4 11:1 `DO ON ERROR UNDO, LEAVE:`
    -> n19 normal
  n19 stmt b4 12:5 `IF i = 2 THEN`
    -> n20 raise(error)
    -> n21 true
    -> n22 false
  n20 handler(error) b4
    -> n23 leave
  n21 stmt b4 12:19 `UNDO, RETURN ERROR "d".`
    -> n15 return-error
  n22 end b4
    -> n23 normal
  n23 after(b4) b0
    -> n24 normal
  n24 stmt b0 14:1 `IF i = 0 THEN`
    -> n25 raise(error)
    -> n26 true
    -> n27 false
  n25 handler(error) b0
    -> n1 leave
  n26 stmt b0 14:15 `RETURN ERROR.`
    -> n15 return-error
  n27 end b0
    -> n1 normal
