unit u0 main
  b0 main @1:1 input
    on error: UNDO, RETRY (default) => retry
    on endkey: UNDO, LEAVE (default)
  b1 repeat @3:1 parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b2 repeat @7:1 parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b3 repeat @10:1 parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE c AS CHARACTER NO-UNDO.`
    -> n3 normal
  n3 stmt b0 2:1 `INPUT FROM VALUE("in.txt").`
    -> n4 raise(error)
    -> n5 normal
  n4 handler(error) b0
    -> n0 retry
  n5 head b1 3:1 `REPEAT:`
    -> n6 loop-body
  n6 stmt b1 4:5 `IMPORT c.`
    -> n7 raise(error)
    -> n8 raise(endkey)
    -> n9 normal
  n7 handler(error) b1
    -> n9 next
  n8 handler(endkey) b1
    -> n10 leave
  n9 end b1
    -> n5 loop-back
  n10 after(b1) b0
    -> n11 normal
  n11 stmt b0 6:1 `INPUT CLOSE.`
    -> n4 raise(error)
    -> n12 normal
  n12 head b2 7:1 `REPEAT:`
    -> n13 loop-body
  n13 stmt b2 8:5 `FIND NEXT Customer NO-LOCK.`
    -> n14 raise(error)
    -> n15 raise(endkey)
    -> n16 normal
  n14 handler(error) b2
    -> n16 next
  n15 handler(endkey) b2
    -> n17 leave
  n16 end b2
    -> n12 loop-back
  n17 after(b2) b0
    -> n18 normal
  n18 head b3 10:1 `REPEAT:`
    -> n19 loop-body
  n19 stmt b3 11:5 `FIND NEXT Customer NO-LOCK NO-ERROR.`
    -> n20 normal
  n20 stmt b3 12:5 `IF NOT AVAILABLE Customer THEN`
    -> n21 raise(error)
    -> n22 true
    -> n24 false
  n21 handler(error) b3
    -> n26 next
  n22 stmt b3 12:36 `LEAVE.`
    -> n23 leave
  n23 after(b3) b0
    -> n27 normal
  n24 stmt b3 13:5 `PAUSE.` opaque=skipped-statement
    -> n21 raise(error)
    -> n25 raise(endkey)
    -> n26 normal
  n25 handler(endkey) b3
    -> n23 leave
  n26 end b3
    -> n18 loop-back
  n27 stmt b0 15:1 `MESSAGE "Continue?" VIEW-AS ALERT-BOX QUESTIO...`
    -> n4 raise(error)
    -> n28 raise(endkey)
    -> n29 normal
  n28 handler(endkey) b0
    -> n1 leave
  n29 end b0
    -> n1 normal
