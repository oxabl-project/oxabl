unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `ON CHOOSE OF b DO:`
    -> n3 normal
  n3 end b0
    -> n1 normal
unit u1 trigger parent=u0
  b0 trigger @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 do @2:3 parent=b0
    on error: UNDO, LEAVE (phrase)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 head b1 2:3 `DO ON ERROR UNDO, LEAVE:`
    -> n3 normal
  n3 stmt b1 3:5 `UNDO, RETURN NO-APPLY.` undoes=b1
    -> n1 return
  n4 stmt b0 5:3 `MESSAGE "after".`
    -> n5 raise(error)
    -> n6 normal
  n5 handler(error) b0
    -> n1 leave
  n6 end b0
    -> n1 normal
