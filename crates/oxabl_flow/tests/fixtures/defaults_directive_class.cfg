directive block-level
unit u0 main
  b0 main @1:1
    on error: UNDO, THROW (block-level)
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `BLOCK-LEVEL ON ERROR UNDO, THROW.`
    -> n3 normal
  n3 end b0
    -> n1 normal
unit u1 method Run parent=u0
  b0 method @3:5
    on error: UNDO, THROW (block-level)
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 4:9 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 stmt b0 5:9 `i = 1.`
    -> n4 raise(error)
    -> n5 normal
  n4 handler(error) b0
    -> n6 throw
  n5 end b0
    -> n1 normal
  n6 exit(error) b0
unit u2 destructor parent=u0
  b0 destructor @7:5
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 8:9 `DEFINE VARIABLE j AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 stmt b0 9:9 `j = 1.`
    -> n4 raise(error)
    -> n5 normal
  n4 handler(error) b0
    -> n1 leave
  n5 end b0
    -> n1 normal
