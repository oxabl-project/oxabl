unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 for-first @2:1 parent=b0 iterating buffers=Customer
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b2 for-last @5:1 parent=b0 iterating buffers=Customer
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b3 for-first @9:1 parent=b0 iterating buffers=Customer,Order
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b4 for-first @12:1 parent=b0 iterating buffers=Customer,Order
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE h AS HANDLE NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `FOR FIRST Customer NO-LOCK:`
    -> n4 raise(error)
    -> n5 loop-done
    -> n6 loop-body
  n4 handler(error) b1
    -> n7 next
  n5 after(b1) b0
    -> n8 normal
  n6 stmt b1 3:5 `CREATE QUERY h.`
    -> n4 raise(error)
    -> n7 normal
  n7 end b1
    -> n5 loop-done
  n8 head b2 5:1 `FOR LAST Customer NO-LOCK:`
    -> n9 raise(error)
    -> n10 loop-done
    -> n11 loop-body
  n9 handler(error) b2
    -> n13 next
  n10 after(b2) b0
    -> n15 normal
  n11 stmt b2 6:5 `IF h = ? THEN`
    -> n9 raise(error)
    -> n12 true
    -> n14 false
  n12 stmt b2 6:19 `NEXT.`
    -> n13 next
  n13 end b2
    -> n10 loop-done
  n14 stmt b2 7:5 `MESSAGE "x".`
    -> n9 raise(error)
    -> n13 normal
  n15 head b3 9:1 `FOR FIRST Customer NO-LOCK, EACH Order OF Cus...`
    -> n16 raise(error)
    -> n17 loop-done
    -> n18 loop-body
  n16 handler(error) b3
    -> n19 next
  n17 after(b3) b0
    -> n20 normal
  n18 stmt b3 10:5 `MESSAGE "many".`
    -> n16 raise(error)
    -> n19 normal
  n19 end b3
    -> n15 loop-back
  n20 head b4 12:1 `FOR FIRST Customer NO-LOCK, LAST Order OF Cus...`
    -> n21 raise(error)
    -> n22 loop-done
    -> n23 loop-body
  n21 handler(error) b4
    -> n24 next
  n22 after(b4) b0
    -> n25 normal
  n23 stmt b4 13:5 `MESSAGE "once".`
    -> n21 raise(error)
    -> n24 normal
  n24 end b4
    -> n22 loop-done
  n25 end b0
    -> n1 normal
