directive routine-level
unit u0 main
  b0 main @1:1
    on error: UNDO, THROW (routine-level)
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `ROUTINE-LEVEL ON ERROR UNDO, THROW.`
    -> n3 normal
  n3 stmt b0 2:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n4 normal
  n4 stmt b0 3:1 `ON CHOOSE OF btn DO:`
    -> n5 normal
  n5 end b0
    -> n1 normal
unit u1 trigger parent=u0
  b0 trigger @3:1
    on error: UNDO, THROW (routine-level)
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 4:5 `i = 1.`
    -> n3 raise(error)
    -> n4 normal
  n3 handler(error) b0
    -> n5 throw
  n4 end b0
    -> n1 normal
  n5 exit(error) b0
