unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 repeat @2:1 parent=b0 iterating
    on error: UNDO, RETRY (phrase)
    on endkey: UNDO, LEAVE (phrase)
    on stop: UNDO, RETRY (phrase)
    on quit: UNDO, LEAVE (phrase)
  b2 do @8:1 parent=b0
    on error: UNDO, RETRY (phrase)
    on endkey: UNDO, LEAVE (phrase)
    on stop: UNDO, RETRY (phrase)
    on quit: UNDO, LEAVE (phrase)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `REPEAT ON ERROR UNDO ON ENDKEY UNDO ON STOP U...`
    -> n4 loop-body
  n4 stmt b1 3:5 `IF i = 1 THEN`
    -> n5 raise(error)
    -> n6 true
    -> n8 false
  n5 handler(error) b1
    -> n14 next
  n6 stmt b1 3:19 `STOP.`
    -> n7 raise(stop)
  n7 handler(stop) b1
    -> n14 next
  n8 stmt b1 4:5 `IF i = 2 THEN`
    -> n5 raise(error)
    -> n9 true
    -> n11 false
  n9 stmt b1 4:19 `QUIT.`
    -> n10 raise(quit)
  n10 handler(quit) b1
    -> n15 leave
  n11 stmt b1 5:5 `PAUSE.` opaque=skipped-statement
    -> n5 raise(error)
    -> n12 raise(endkey)
    -> n13 normal
  n12 handler(endkey) b1
    -> n15 leave
  n13 stmt b1 6:5 `i = 3.`
    -> n5 raise(error)
    -> n14 normal
  n14 end b1
    -> n3 loop-back
  n15 after(b1) b0
    -> n16 normal
  n16 head b2 8:1 `DO ON ERROR UNDO ON ENDKEY UNDO ON STOP UNDO ...`
    -> n17 normal
  n17 stmt b2 9:5 `IF i = 4 THEN`
    -> n18 raise(error)
    -> n19 true
    -> n21 false
  n18 handler(error) b2
    -> n27 leave
  n19 stmt b2 9:19 `STOP.`
    -> n20 raise(stop)
  n20 handler(stop) b2
    -> n27 leave
  n21 stmt b2 10:5 `IF i = 5 THEN`
    -> n18 raise(error)
    -> n22 true
    -> n24 false
  n22 stmt b2 10:19 `QUIT.`
    -> n23 raise(quit)
  n23 handler(quit) b2
    -> n27 leave
  n24 stmt b2 11:5 `PAUSE.` opaque=skipped-statement
    -> n18 raise(error)
    -> n25 raise(endkey)
    -> n26 normal
  n25 handler(endkey) b2
    -> n27 leave
  n26 end b2
    -> n27 normal
  n27 after(b2) b0
    -> n28 normal
  n28 end b0
    -> n1 normal
