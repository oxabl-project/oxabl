unit u0 main
  b0 main @1:1
    on error: UNDO, RETRY (default) => leave
    on endkey: UNDO, LEAVE (default)
  b1 do @2:1 parent=b0 iterating
  b2 do @5:1 parent=b0 iterating
  b3 repeat @9:1 parent=b0 iterating
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b4 for-first @13:1 parent=b0 iterating buffers=Customer
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b5 for-last @16:1 parent=b0 iterating buffers=Customer
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  b6 repeat @18:1 parent=b0 iterating transaction
    on error: UNDO, RETRY (default) => next
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n3 normal
  n3 head b1 2:1 `DO WHILE i < 10:`
    -> n4 raise(error)
    -> n5 loop-done
    -> n6 loop-body
  n4 handler(error) b0
    -> n1 leave
  n5 after(b1) b0
    -> n8 normal
  n6 stmt b1 3:5 `i = i + 1.`
    -> n4 raise(error)
    -> n7 normal
  n7 end b1
    -> n3 loop-back
  n8 head b2 5:1 `DO i = 1 TO 5:`
    -> n4 raise(error)
    -> n9 loop-done
    -> n10 loop-body
  n9 after(b2) b0
    -> n15 normal
  n10 stmt b2 6:5 `IF i = 3 THEN`
    -> n4 raise(error)
    -> n11 true
    -> n13 false
  n11 stmt b2 6:19 `NEXT.`
    -> n12 next
  n12 end b2
    -> n8 loop-back
  n13 stmt b2 7:5 `IF i = 4 THEN`
    -> n4 raise(error)
    -> n14 true
    -> n12 false
  n14 stmt b2 7:19 `LEAVE.`
    -> n9 leave
  n15 head b3 9:1 `REPEAT:`
    -> n16 loop-body
  n16 stmt b3 10:5 `i = i - 1.`
    -> n17 raise(error)
    -> n18 normal
  n17 handler(error) b3
    -> n21 next
  n18 stmt b3 11:5 `IF i < 0 THEN`
    -> n17 raise(error)
    -> n19 true
    -> n21 false
  n19 stmt b3 11:19 `LEAVE.`
    -> n20 leave
  n20 after(b3) b0
    -> n22 normal
  n21 end b3
    -> n15 loop-back
  n22 head b4 13:1 `FOR FIRST Customer NO-LOCK:`
    -> n23 raise(error)
    -> n24 loop-done
    -> n25 loop-body
  n23 handler(error) b4
    -> n26 next
  n24 after(b4) b0
    -> n27 normal
  n25 stmt b4 14:5 `i = 0.`
    -> n23 raise(error)
    -> n26 normal
  n26 end b4
    -> n24 loop-done
  n27 head b5 16:1 `FOR LAST Customer NO-LOCK:`
    -> n28 raise(error)
    -> n29 loop-done
    -> n30 loop-body
  n28 handler(error) b5
    -> n30 next
  n29 after(b5) b0
    -> n31 normal
  n30 end b5
    -> n29 loop-done
  n31 head b6 18:1 `REPEAT TRANSACTION:`
    -> n32 loop-body
  n32 stmt b6 19:5 `i = 1.`
    -> n33 raise(error)
    -> n34 normal
  n33 handler(error) b6
    -> n34 next
  n34 end b6
    -> n31 loop-back
