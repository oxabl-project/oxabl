directive block-level
unit u0 main
  b0 main @1:1
    on error: UNDO, THROW (block-level)
    on endkey: UNDO, LEAVE (default)
  b1 for-each @3:1 parent=b0 iterating buffers=Customer
    on error: UNDO, THROW (block-level)
    on endkey: UNDO, LEAVE (default)
  b2 do @6:1 parent=b0
    on error: UNDO, LEAVE (phrase)
  b3 do @9:1 parent=b0 transaction
    on error: UNDO, THROW (block-level)
    on endkey: UNDO, LEAVE (default)
  n0 entry b0
    -> n2 normal
  n1 exit(return) b0
  n2 stmt b0 1:1 `BLOCK-LEVEL ON ERROR UNDO, THROW.`
    -> n3 normal
  n3 stmt b0 2:1 `DEFINE VARIABLE i AS INTEGER NO-UNDO.`
    -> n4 normal
  n4 head b1 3:1 `FOR EACH Customer NO-LOCK:`
    -> n5 raise(error)
    -> n6 loop-done
    -> n7 loop-body
  n5 handler(error) b1
    -> n9 throw
  n6 after(b1) b0
    -> n11 normal
  n7 stmt b1 4:5 `IF i = 1 THEN`
    -> n5 raise(error)
    -> n8 true
    -> n10 false
  n8 stmt b1 4:19 `UNDO.` undoes=b1
    -> n9 throw
  n9 handler(error) b0
    -> n24 throw
  n10 end b1
    -> n4 loop-back
  n11 head b2 6:1 `DO ON ERROR UNDO, LEAVE:`
    -> n12 normal
  n12 stmt b2 7:5 `IF i = 2 THEN`
    -> n13 raise(error)
    -> n14 true
    -> n16 false
  n13 handler(error) b2
    -> n15 leave
  n14 stmt b2 7:19 `UNDO.` undoes=b2
    -> n15 leave
  n15 after(b2) b0
    -> n17 normal
  n16 end b2
    -> n15 normal
  n17 head b3 9:1 `DO TRANSACTION:`
    -> n18 normal
  n18 stmt b3 10:5 `IF i = 3 THEN`
    -> n19 raise(error)
    -> n20 true
    -> n21 false
  n19 handler(error) b3
    -> n9 throw
  n20 stmt b3 10:19 `UNDO.` undoes=b3
    -> n9 throw
  n21 end b3
    -> n22 normal
  n22 after(b3) b0
    -> n23 normal
  n23 end b0
    -> n1 normal
  n24 exit(error) b0
