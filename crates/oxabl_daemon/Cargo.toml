[package]
name = "oxabl_daemon"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Long-lived oxabl session core: one salsa instance per workspace root, serving several clients"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_daemon"

# NOTE: this crate is the *only* place besides nothing else that may know about
# salsa. It sits above `oxabl_pipeline` and `oxabl_index`, which are forbidden a
# salsa edge because the umbrella re-exports the pipeline unconditionally and the
# WASM bundle builds through the umbrella. Keep the direction: the daemon depends
# on the shared run, never the other way.
#
# Absent from `release-please-config.json`, like the other client-layer crates.
[dependencies]
oxabl_analyze = { path = "../oxabl_analyze", version = "1.1.1" }
oxabl_ast = { path = "../oxabl_ast", version = "1.0.0" }
oxabl_common = { path = "../oxabl_common", version = "1.1.0" }
oxabl_daemon_protocol = { path = "../oxabl_daemon_protocol", version = "0.2.0" }
oxabl_index = { path = "../oxabl_index", version = "1.0.0" }
oxabl_pipeline = { path = "../oxabl_pipeline", version = "1.1.1" }
oxabl_semantic = { path = "../oxabl_semantic", version = "1.0.2" }
oxabl_workspace = { path = "../oxabl_workspace", version = "1.0.2" }
anyhow = "1"
crossbeam-channel = "0.5"
lsp-server = "0.7"
# Pinned exact patch: the write-on-main / read-on-snapshot / `Cancelled` threading
# discipline is verified against this salsa release.
salsa = "=0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
oxabl_schema = { path = "../oxabl_schema", version = "0.2.2", features = [
    "test-support",
] }
# Arms `panic_if_injected`, so a source carrying an `OXABL-TEST-PANIC:<site>`
# marker panics at the guarded site. No ABL input panics, so this is the only way
# to test that a genuine panic fails one request and is never retried.
oxabl_common = { path = "../oxabl_common", version = "1.1.0", features = [
    "test-panics",
] }
# The shared cross-client parity fixture table, for the daemon's parity leg.
oxabl_pipeline = { path = "../oxabl_pipeline", version = "1.1.1", features = [
    "test-support",
] }
tempfile = "3"

[[bench]]
name = "daemon_cycle_bench"
harness = false
