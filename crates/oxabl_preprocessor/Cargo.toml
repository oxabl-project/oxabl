[package]
name = "oxabl_preprocessor"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "Preprocessor for ABL source code: include expansion, &IF evaluation, and preprocessor variable tracking"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_preprocessor"

[dependencies]
oxabl_common = { path = "../oxabl_common", version = "2.0.0" }
oxabl_ast = { path = "../oxabl_ast", version = "8.0.0" }
oxabl_workspace = { path = "../oxabl_workspace", version = "4.0.0" }
rustc-hash = "2"

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }

[[bench]]
name = "preprocessor_bench"
harness = false

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
