[package]
name = "oxabl_pipeline"
version = "3.1.0"
edition = "2024"
license = "MIT"
description = "Shared lint and format pipelines over one resolved oxabl configuration"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_pipeline"

# NOTE (KTD1/KTD6): this crate sits *beneath* `oxabl_lsp`, `oxabl_wasm`, and the
# `oxabl` umbrella, so it must depend on none of them. It must also never gain a
# incremental-database dependency: the umbrella re-exports this crate unconditionally, and the
# browser bundle goes through the umbrella, so that edge would land in
# the WASM payload.
#
# That rule extends transitively to everything this crate pulls in, and
# `oxabl_index` is the newest such edge: it is the batch cross-file index every
# non-incremental client resolves through, it must stay free of that engine for exactly
# the reason above, and it carries the mirror of this note at the head of its own
# manifest. The language server's incremental index implements the same
# `WorkspaceIndex` seam *above* this crate, which keeps the engine on the one
# side of the seam the browser never reaches.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxabl_effects = { path = "../oxabl_effects", version = "0.2.1" }
oxabl_lexer = { path = "../oxabl_lexer", version = "2.0.0" }
oxabl_parser = { path = "../oxabl_parser", version = "3.0.1" }
oxabl_flow = { path = "../oxabl_flow", version = "0.3.1" }
oxabl_scope = { path = "../oxabl_scope", version = "0.2.1" }
# For `Span`: a dependency edge carries the offsets in the dependent file where the
# dependency is written, and `src/reverse.rs` hands them to a client.
oxabl_ast = { path = "../oxabl_ast", version = "3.0.0" }
oxabl_analyze = { path = "../oxabl_analyze", version = "3.0.1" }
oxabl_common = { path = "../oxabl_common", version = "1.2.1" }
oxabl_formatter = { path = "../oxabl_formatter", version = "2.0.1" }
oxabl_index = { path = "../oxabl_index", version = "3.0.1" }
oxabl_lint = { path = "../oxabl_lint", version = "3.0.1" }
oxabl_schema = { path = "../oxabl_schema", version = "0.4.1" }
oxabl_semantic = { path = "../oxabl_semantic", version = "3.0.1" }
oxabl_style = { path = "../oxabl_style", version = "0.2.0" }
oxabl_workspace = { path = "../oxabl_workspace", version = "3.1.0" }

[features]
# The cross-client parity fixture table (`src/fixtures.rs`), shared by the four
# R19 parity legs. Off by default and enabled only from a leg's
# `[dev-dependencies]`: `#[cfg(test)]` is unreachable from another crate, so the
# table has to live in `src/`, and ungated it would become part of this crate's
# public API *and* be compiled into the `oxabl_wasm` payload — the umbrella
# re-exports this crate unconditionally so the browser can reach it. Mirrors
# `oxabl_schema`'s `test-support`, which four crates already take this way.
test-support = ["oxabl_schema/test-support"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
# NOTE: no self `oxabl_pipeline = { path = "." }` entry here. Feature-enabling a
# crate for its own `tests/` target needs one, and Cargo accepts it, but
# release-please's `cargo-workspace` plugin reads the `path = "."` edge as a
# dependency cycle and fails the release run outright. This crate's parity leg
# therefore lives in `src/parity.rs` under `#[cfg(test)]`, where the fixture
# table is in scope without a feature; see `src/fixtures.rs`.
# Arms `panic_if_injected` so a source carrying an `OXABL-TEST-PANIC:<site>`
# marker panics at the guarded site. No ABL input panics today, so this is the
# only way to test that `LintPipeline::run` contains a panic while `expand` and
# `collect` deliberately do not (KTD6, R20). Dev-only, so it is never armed in a
# real build.
oxabl_common = { path = "../oxabl_common", version = "1.2.1", features = [
    "test-panics",
] }
# The shared `Customer(CustNum, Name)` fixture, so the schema-gated lint tests
# assert against the same schema every other crate's tests use.
oxabl_schema = { path = "../oxabl_schema", version = "0.4.1", features = [
    "test-support",
] }

[[bench]]
name = "edge_bench"
harness = false
