[package]
name = "oxabl_formatter"
version = "3.0.0"
edition = "2024"
license = "MIT"
description = "Layout-only formatting engine for Progress ABL, built on the oxabl fidelity substrate"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_formatter"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "7.0.0" }
oxabl_common = { path = "../oxabl_common", version = "1.6.0" }
oxabl_lexer = { path = "../oxabl_lexer", version = "3.0.0" }
oxabl_parser = { path = "../oxabl_parser", version = "6.0.0" }
oxabl_style = { path = "../oxabl_style", version = "0.2.1" }

[dev-dependencies]
oxabl_lexer = { path = "../oxabl_lexer", version = "3.0.0", features = [
    "test-counters",
] }
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }

[[bench]]
name = "formatter_bench"
harness = false

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
