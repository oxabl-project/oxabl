[package]
name = "oxabl_lexer"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Tokenizer for Progress ABL source code"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_lexer"

[dependencies]
oxabl_common = { path = "../oxabl_common" }
rust_decimal = "1.40.0"
string_cache = "0.9.0"

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }


[build-dependencies]
string_cache_codegen = "0.6"

[[bench]]
name = "lexer_bench"
harness = false
