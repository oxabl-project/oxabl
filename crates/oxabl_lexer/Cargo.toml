[package]
name = "oxabl_lexer"
version = "4.0.0"
edition = "2024"
license = "MIT"
description = "Tokenizer for Progress ABL source code"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_lexer"

[dependencies]
rust_decimal = "1.40.0"
string_cache = "0.9.0"

[features]
# Test only: count the lexers built, for tests that want to see that a pipeline
# lexes a text a fixed number of times. Never on in a shipped build.
test-counters = []

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
oxabl_common = { path = "../oxabl_common", version = "2.0.0" }


[build-dependencies]
string_cache_codegen = "0.6"

[[bench]]
name = "lexer_bench"
harness = false

[lints]
workspace = true
