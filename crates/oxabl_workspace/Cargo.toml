[package]
name = "oxabl_workspace"
version = "4.0.0"
edition = "2024"
license = "MIT"
description = "Workspace configuration, file system abstraction, and file discovery for the Oxabl ABL tooling suite"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_workspace"

[dependencies]
oxabl_common = { path = "../oxabl_common", version = "2.0.0" }
oxabl_ast = { path = "../oxabl_ast", version = "8.0.0" }
oxabl_style = { path = "../oxabl_style", version = "0.3.0" }
encoding_rs = "0.8"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
serde_json = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
