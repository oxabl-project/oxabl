[package]
name = "oxabl_analyze"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "JSON dump + analyze CLI wiring for the oxabl semantic model"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_analyze"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "1.0.0" }
oxabl_common = { path = "../oxabl_common", version = "1.1.0" }
oxabl_lexer = { path = "../oxabl_lexer", version = "1.0.1" }
oxabl_lint = { path = "../oxabl_lint", version = "1.0.1" }
oxabl_parser = { path = "../oxabl_parser", version = "1.0.1" }
oxabl_preprocessor = { path = "../oxabl_preprocessor", version = "0.5.0" }
oxabl_schema = { path = "../oxabl_schema", version = "0.2.1" }
oxabl_semantic = { path = "../oxabl_semantic", version = "1.0.1" }
oxabl_workspace = { path = "../oxabl_workspace", version = "1.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests only: the cross-file envelope tests run the *real* batch index over an
# in-memory filesystem rather than a hand-written stub, so what they pin is the
# dump every client emits. `oxabl_index` sits above this crate at run time and
# must never become a normal dependency of it.
oxabl_index = { path = "../oxabl_index", version = "0.1.2" }
oxabl_schema = { path = "../oxabl_schema", version = "0.2.1", features = ["test-support"] }
