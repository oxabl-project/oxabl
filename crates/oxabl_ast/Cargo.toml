[package]
name = "oxabl_ast"
version = "7.0.0"
edition = "2024"
license = "MIT"
description = "AST node definitions for the Oxabl ABL parser"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_ast"

[dependencies]
rust_decimal = "1.40.0"
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }
serde = { version = "1", optional = true, features = ["derive"] }

[features]
# Opt-in `Serialize` on the diagnostic-family carve-out (`Span`). The bulk of
# the AST (statements/expressions) is intentionally left underived.
serde = ["dep:serde"]

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
