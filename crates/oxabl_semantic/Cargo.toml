[package]
name = "oxabl_semantic"
version = "7.0.0"
edition = "2024"
license = "MIT"
description = "Semantic analysis for Progress ABL: symbol table, scope tree, resolution, and types"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_semantic"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "7.0.0" }
oxabl_common = { path = "../oxabl_common", version = "1.6.0" }
oxabl_lexer = { path = "../oxabl_lexer", version = "3.0.0" }
oxabl_schema = { path = "../oxabl_schema", version = "0.6.2" }
bitflags = "2"
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }

[features]
# Test-only: count the scope records that the searches of a scope tree read
# (`ScopeTree::scopes_read`), so a test can see that the count grows with the
# number of scopes and not with its square.
test-counts = []

[dev-dependencies]
rust_decimal = "1.40.0"
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
oxabl_lexer = { path = "../oxabl_lexer", version = "3.0.0" }
oxabl_parser = { path = "../oxabl_parser", version = "6.0.0" }
oxabl_schema = { path = "../oxabl_schema", version = "0.6.2", features = ["test-support"] }

[[bench]]
name = "semantic_bench"
harness = false

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
