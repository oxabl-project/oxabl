[package]
name = "oxabl_semantic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Semantic analysis for Progress ABL: symbol table, scope tree, resolution, and types"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_semantic"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "0.5.0" }
oxabl_common = { path = "../oxabl_common", version = "0.5.0" }
oxabl_lexer = { path = "../oxabl_lexer", version = "0.4.1" }
oxabl_schema = { path = "../oxabl_schema", version = "0.1.0" }
bitflags = "2"
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }

[dev-dependencies]
rust_decimal = "1.40.0"
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
oxabl_lexer = { path = "../oxabl_lexer", version = "0.4.1" }
oxabl_parser = { path = "../oxabl_parser", version = "0.6.0" }
oxabl_schema = { path = "../oxabl_schema", version = "0.1.0", features = ["test-support"] }

[[bench]]
name = "semantic_bench"
harness = false
