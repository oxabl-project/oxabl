[package]
name = "oxabl_wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Thin WebAssembly client for the shared Oxabl analysis and formatting pipelines"
repository = "https://github.com/oxabl-project/oxabl"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxabl = { path = "../oxabl", version = "0.5.0", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.108"
