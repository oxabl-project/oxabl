[package]
name = "oxabl_wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Thin WebAssembly client for the shared Oxabl analysis and formatting pipelines"
repository = "https://github.com/oxabl-project/oxabl"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxabl = { path = "../oxabl", version = "0.5.0", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pin, not a caret range. The browser recovery path depends on
# `--experimental-reset-state-function` and the generated `__wbg_reset_state`,
# which is generated glue rather than a semver-stable API. An exact pin keeps a
# routine `cargo update` inside 0.2.x from moving that machinery underneath the
# exact-pinned CLI (`scripts/build-wasm.sh`, `.github/workflows/release.yml`).
wasm-bindgen = "=0.2.126"

[features]
# Test-only panic vehicle. No ABL input reaches a parser panic, so the browser's
# crash-and-recover path is unverifiable without a way to panic on demand. This
# feature adds a `debug_panic()` export and is enabled only by
# `scripts/build-wasm.sh --verify` for a local verification build — never for the
# release artifact.
debug-panic = []
