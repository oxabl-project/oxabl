[package]
name = "oxabl_fake_avm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fake AVM worker that speaks the oxabl build worker protocol, for black-box tests"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_fake_avm"
publish = false

# No oxabl crate on purpose: the fake stands in for Progress, so it carries its
# own codec and a codec bug in oxabl cannot hide behind the same bug here.
[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
