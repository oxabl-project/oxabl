[package]
name = "oxabl"
version = "6.1.0"
edition = "2024"
license = "MIT"
description = "High-performance tooling suite for Progress ABL"
repository = "https://github.com/oxabl-project/oxabl"
homepage = "https://oxabl.org"
documentation = "https://docs.oxabl.org/"

[[bin]]
name = "oxabl"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
oxabl_parser = { path = "../oxabl_parser", version = "5.0.1" }
oxabl_lexer = { path = "../oxabl_lexer", version = "2.0.5" }
oxabl_common = { path = "../oxabl_common", version = "1.5.0" }
oxabl_ast = { path = "../oxabl_ast", version = "6.0.0" }
oxabl_workspace = { path = "../oxabl_workspace", version = "3.7.1" }
oxabl_preprocessor = { path = "../oxabl_preprocessor", version = "0.9.1" }
oxabl_semantic = { path = "../oxabl_semantic", version = "6.0.1" }
oxabl_schema = { path = "../oxabl_schema", version = "0.6.1" }
oxabl_analyze = { path = "../oxabl_analyze", version = "4.5.0" }
# Plain, non-optional: `oxabl_wasm` takes the umbrella with `default-features =
# false`, so a `cli`-gated pipeline re-export would be invisible to the browser.
oxabl_pipeline = { path = "../oxabl_pipeline", version = "4.1.0" }
oxabl_lint = { path = "../oxabl_lint", version = "6.0.1" }
oxabl_lsp = { path = "../oxabl_lsp", version = "3.5.0", optional = true }
oxabl_daemon = { path = "../oxabl_daemon", version = "0.9.0", optional = true }
oxabl_build = { path = "../oxabl_build", version = "0.9.1", optional = true }
oxabl_build_remote = { path = "../oxabl_build_remote", version = "0.2.14", optional = true }
oxabl_formatter = { path = "../oxabl_formatter", version = "2.1.3" }
oxabl_style = { path = "../oxabl_style", version = "0.2.1" }
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.6", optional = true }
ctrlc = { version = "3", features = ["termination"], optional = true }
lsp-server = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
schemars = { version = "0.8", optional = true }
# `self-update` only. Both are already in the lock through the remote cache's
# client, so the feature adds no new crate to a release binary.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
sha2 = { version = "0.10", optional = true }
rustix = { version = "1", features = ["fs", "process"], optional = true }
# The schema cache hashes the `.df` files it keys an entry by.
blake3 = { version = "1", optional = true }

[[test]]
name = "self_update"
required-features = ["self-update"]

[[test]]
name = "build_remote_cache"
required-features = ["remote-cache"]

[[test]]
name = "build_remote_fetch_volume"
required-features = ["remote-cache"]

[[test]]
name = "build_remote_fetch_tree"
required-features = ["remote-cache"]

[[test]]
name = "build_remote_faults"
required-features = ["remote-cache"]

[[test]]
name = "build_remote_trust"
required-features = ["remote-cache"]

[features]
# `serde` propagates the diagnostic-family `Serialize` derives up from the
# sub-crates. It is on by default so the `oxabl` binary can serialize
# diagnostics directly; a library consumer that doesn't serialize can opt out
# with `default-features = false`.
default = ["serde", "cli"]
serde = ["oxabl_ast/serde", "oxabl_common/serde", "oxabl_parser/serde"]
# The CLI serializes diagnostics through `serde_json`, so it cannot build
# without the `serde` derives the sub-crates gate behind our `serde` feature.
# Implying it here keeps `--no-default-features --features cli` compiling.
cli = [
    "serde",
    "dep:clap",
    "dep:indicatif",
    "dep:notify",
    "dep:notify-debouncer-full",
    "dep:ctrlc",
    "dep:lsp-server",
    "dep:oxabl_lsp",
    "dep:oxabl_daemon",
    "dep:oxabl_build",
    "dep:schemars",
    "dep:serde_json",
    "dep:tikv-jemallocator",
    "dep:blake3",
    "dep:rustix",
]

# The remote cache of `oxabl build`. Off by default: it brings the network and
# crypto stack, which the library, the wasm build and a plain
# `cargo install oxabl` do not need.
remote-cache = ["cli", "dep:oxabl_build_remote"]

# `oxabl self-update` and the background check of a managed binary. Off by
# default for the same reason as `remote-cache`: it links the network and TLS
# stack, which a plain `cargo install oxabl` does not need.
self-update = [
    "cli",
    "dep:reqwest",
    "dep:tokio",
    "dep:sha2",
    "dep:rustix",
]

# The CLI's allocator. Its workers allocate heavily on every core, where
# jemalloc is markedly faster than the system allocator. MSVC and wasm keep
# the system one.
[target.'cfg(not(any(target_env = "msvc", target_arch = "wasm32")))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }

[lints.rust]
# `RUSTFLAGS="--cfg oxabl_system_allocator"` builds the CLI with the system
# allocator instead of jemalloc, for heap profilers such as heaptrack and
# valgrind's DHAT, which see only the C library's allocator
# (`scripts/bench/cli.sh`). A flag and not a cargo feature, so no dependent
# crate and no `--all-features` build can turn jemalloc off.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(oxabl_system_allocator)'] }

[dev-dependencies]
tempfile = "3"
blake3 = "1"
sha2 = "0.10"
# Tests change the format number of the build store and read it back.
rusqlite = { version = "0.37", features = ["bundled"] }
oxabl_daemon_protocol = { path = "../oxabl_daemon_protocol", version = "0.4.1" }
oxabl_analyze = { path = "../oxabl_analyze", version = "4.5.0" }
oxabl_common = { path = "../oxabl_common", version = "1.5.0", features = [
    "test-panics",
] }
oxabl_semantic = { path = "../oxabl_semantic", version = "6.0.1", features = [
    "test-counts",
] }
# Counts the parses of a test build (`OXABL_TEST_PARSES`).
oxabl_parser = { path = "../oxabl_parser", version = "5.0.1", features = [
    "test-counters",
] }
oxabl_schema = { path = "../oxabl_schema", version = "0.6.1" }
oxabl_workspace = { path = "../oxabl_workspace", version = "3.7.1" }
# A test build of the binary counts what it lexes and parses
# (`OXABL_TEST_LEX_PARSE`, `tests/check_lex_parse_counts.rs`).
oxabl_lexer = { path = "../oxabl_lexer", version = "2.0.5", features = [
    "test-counters",
] }
# The shared cross-client parity fixture table (R19). A dev-dependency feature
# only: the shipped binary and the library both take `oxabl_pipeline` without it.
oxabl_pipeline = { path = "../oxabl_pipeline", version = "4.1.0", features = [
    "test-support",
] }
serde_json = "1"
# Examples only. The CLI walks trees through `oxabl_workspace::discover_path`
# now, so nothing in the shipped binary needs a directory walker of its own.
walkdir = "2"
# The `flow_corpus` example only; the CLI does not build CFGs yet.
oxabl_flow = { path = "../oxabl_flow", version = "0.5.1" }
# The `handles_corpus` example only.
oxabl_handles = { path = "../oxabl_handles", version = "0.3.1" }
# The `scope_corpus` and `scope_listing` examples only.
oxabl_scope = { path = "../oxabl_scope", version = "0.3.1" }
# The `effects_corpus` and `effects_xref` examples only.
oxabl_effects = { path = "../oxabl_effects", version = "0.3.10" }
# The `nulls_corpus` example only.
oxabl_nulls = { path = "../oxabl_nulls", version = "0.3.1" }
oxabl_index = { path = "../oxabl_index", version = "6.0.1" }
