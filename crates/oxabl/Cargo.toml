[package]
name = "oxabl"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "High-performance tooling suite for Progress ABL"
repository = "https://github.com/oxabl-project/oxabl"

[[bin]]
name = "oxabl"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
oxabl_parser = { path = "../oxabl_parser", version = "0.6.0" }
oxabl_lexer = { path = "../oxabl_lexer", version = "0.4.1" }
oxabl_common = { path = "../oxabl_common", version = "0.5.0" }
oxabl_ast = { path = "../oxabl_ast", version = "0.5.0" }
oxabl_workspace = { path = "../oxabl_workspace", version = "0.4.0" }
oxabl_preprocessor = { path = "../oxabl_preprocessor", version = "0.3.1" }
oxabl_semantic = { path = "../oxabl_semantic", version = "0.1.0" }
oxabl_schema = { path = "../oxabl_schema", version = "0.1.0" }
oxabl_analyze = { path = "../oxabl_analyze", version = "0.1.0" }
oxabl_lint = { path = "../oxabl_lint", version = "0.1.0" }
oxabl_lsp = { path = "../oxabl_lsp", version = "0.1.0", optional = true }
oxabl_formatter = { path = "../oxabl_formatter", version = "0.1.0" }
oxabl_style = { path = "../oxabl_style", version = "0.1.0" }
clap = { version = "4", features = ["derive"], optional = true }
walkdir = { version = "2", optional = true }
indicatif = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
schemars = { version = "0.8", optional = true }

[features]
# `serde` propagates the diagnostic-family `Serialize` derives up from the
# sub-crates. It is on by default so the `oxabl` binary can serialize
# diagnostics directly; a library consumer that doesn't serialize can opt out
# with `default-features = false`.
default = ["serde", "cli"]
serde = ["oxabl_ast/serde", "oxabl_common/serde", "oxabl_parser/serde"]
cli = [
    "dep:clap",
    "dep:indicatif",
    "dep:oxabl_lsp",
    "dep:schemars",
    "dep:serde_json",
    "dep:walkdir",
]

[dev-dependencies]
tempfile = "3"
oxabl_analyze = { path = "../oxabl_analyze", version = "0.1.0" }
oxabl_common = { path = "../oxabl_common", version = "0.5.0", features = [
    "test-panics",
] }
oxabl_schema = { path = "../oxabl_schema", version = "0.1.0" }
oxabl_workspace = { path = "../oxabl_workspace", version = "0.4.0" }
serde_json = "1"
