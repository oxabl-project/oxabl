[package]
name = "oxabl"
version = "3.0.3"
edition = "2024"
license = "MIT"
description = "High-performance tooling suite for Progress ABL"
repository = "https://github.com/oxabl-project/oxabl"

[[bin]]
name = "oxabl"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
oxabl_parser = { path = "../oxabl_parser", version = "3.0.2" }
oxabl_lexer = { path = "../oxabl_lexer", version = "2.0.0" }
oxabl_common = { path = "../oxabl_common", version = "1.2.1" }
oxabl_ast = { path = "../oxabl_ast", version = "3.0.0" }
oxabl_workspace = { path = "../oxabl_workspace", version = "3.2.0" }
oxabl_preprocessor = { path = "../oxabl_preprocessor", version = "0.7.2" }
oxabl_semantic = { path = "../oxabl_semantic", version = "3.0.2" }
oxabl_schema = { path = "../oxabl_schema", version = "0.4.2" }
oxabl_analyze = { path = "../oxabl_analyze", version = "3.0.3" }
# Plain, non-optional: `oxabl_wasm` takes the umbrella with `default-features =
# false`, so a `cli`-gated pipeline re-export would be invisible to the browser.
oxabl_pipeline = { path = "../oxabl_pipeline", version = "3.2.1" }
oxabl_lint = { path = "../oxabl_lint", version = "3.0.3" }
oxabl_lsp = { path = "../oxabl_lsp", version = "3.0.3", optional = true }
oxabl_daemon = { path = "../oxabl_daemon", version = "0.5.3", optional = true }
oxabl_formatter = { path = "../oxabl_formatter", version = "2.0.2" }
oxabl_style = { path = "../oxabl_style", version = "0.2.0" }
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.6", optional = true }
ctrlc = { version = "3", optional = true }
lsp-server = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
schemars = { version = "0.8", optional = true }

[features]
# `serde` propagates the diagnostic-family `Serialize` derives up from the
# sub-crates. It is on by default so the `oxabl` binary can serialize
# diagnostics directly; a library consumer that doesn't serialize can opt out
# with `default-features = false`.
default = ["serde", "cli"]
serde = ["oxabl_ast/serde", "oxabl_common/serde", "oxabl_parser/serde"]
# The CLI serializes diagnostics through `serde_json`, so it cannot build
# without the `serde` derives the sub-crates gate behind our `serde` feature.
# Implying it here keeps `--no-default-features --features cli` compiling.
cli = [
    "serde",
    "dep:clap",
    "dep:indicatif",
    "dep:notify",
    "dep:notify-debouncer-full",
    "dep:ctrlc",
    "dep:lsp-server",
    "dep:oxabl_lsp",
    "dep:oxabl_daemon",
    "dep:schemars",
    "dep:serde_json",
    "dep:tikv-jemallocator",
]

# The CLI's allocator. Its workers allocate heavily on every core, where
# jemalloc is markedly faster than the system allocator. MSVC and wasm keep
# the system one.
[target.'cfg(not(any(target_env = "msvc", target_arch = "wasm32")))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"
oxabl_daemon_protocol = { path = "../oxabl_daemon_protocol", version = "0.3.0" }
oxabl_analyze = { path = "../oxabl_analyze", version = "3.0.3" }
oxabl_common = { path = "../oxabl_common", version = "1.2.1", features = [
    "test-panics",
] }
oxabl_schema = { path = "../oxabl_schema", version = "0.4.2" }
oxabl_workspace = { path = "../oxabl_workspace", version = "3.2.0" }
# The shared cross-client parity fixture table (R19). A dev-dependency feature
# only: the shipped binary and the library both take `oxabl_pipeline` without it.
oxabl_pipeline = { path = "../oxabl_pipeline", version = "3.2.1", features = [
    "test-support",
] }
serde_json = "1"
# Examples only. The CLI walks trees through `oxabl_workspace::discover_path`
# now, so nothing in the shipped binary needs a directory walker of its own.
walkdir = "2"
# The `flow_corpus` example only; the CLI does not build CFGs yet.
oxabl_flow = { path = "../oxabl_flow", version = "0.3.3" }
# The `handles_corpus` example only.
oxabl_handles = { path = "../oxabl_handles", version = "0.2.3" }
# The `scope_corpus` and `scope_listing` examples only.
oxabl_scope = { path = "../oxabl_scope", version = "0.2.3" }
# The `effects_corpus` and `effects_xref` examples only.
oxabl_effects = { path = "../oxabl_effects", version = "0.2.3" }
# The `nulls_corpus` example only.
oxabl_nulls = { path = "../oxabl_nulls", version = "0.2.3" }
oxabl_index = { path = "../oxabl_index", version = "3.1.0" }
