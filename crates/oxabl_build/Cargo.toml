[package]
name = "oxabl_build"
version = "0.9.2"
edition = "2024"
license = "MIT"
description = "The oxabl build tool: graph store, incremental refresh, planner, AVM worker pool and worker protocol"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_build"

[dependencies]
oxabl_common = { path = "../oxabl_common", version = "1.6.0" }
oxabl_effects = { path = "../oxabl_effects", version = "0.3.11" }
oxabl_index = { path = "../oxabl_index", version = "7.0.0" }
oxabl_pipeline = { path = "../oxabl_pipeline", version = "5.0.0" }
oxabl_semantic = { path = "../oxabl_semantic", version = "7.0.0" }
oxabl_workspace = { path = "../oxabl_workspace", version = "3.8.0" }
blake3 = "1"
encoding_rs = "0.8"
glob = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
rustc-hash = "2"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
oxabl_lexer = { path = "../oxabl_lexer", version = "3.0.0" }
tempfile = "3"

# Not on the workspace lints yet: its counts are in tigerstyle-ratchet.txt
# (docs/TIGER_STYLE.md). The empty table tells cargo that this is on purpose.
[lints]
