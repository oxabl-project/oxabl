[package]
name = "oxabl_build"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "The oxabl build tool: graph store, incremental refresh, planner, AVM worker pool and worker protocol"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_build"

[dependencies]
oxabl_common = { path = "../oxabl_common", version = "1.2.2" }
oxabl_effects = { path = "../oxabl_effects", version = "0.3.2" }
oxabl_index = { path = "../oxabl_index", version = "5.0.1" }
oxabl_lexer = { path = "../oxabl_lexer", version = "2.0.1" }
oxabl_pipeline = { path = "../oxabl_pipeline", version = "3.4.0" }
oxabl_semantic = { path = "../oxabl_semantic", version = "5.0.1" }
oxabl_workspace = { path = "../oxabl_workspace", version = "3.4.0" }
blake3 = "1"
encoding_rs = "0.8"
glob = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
rustc-hash = "2"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
