[package]
name = "oxabl_schema"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Progress OpenEdge .df schema parser and model"
repository = "https://github.com/oxabl-project/oxabl/crates/oxabl_schema"

[dependencies]
oxabl_ast = { path = "../oxabl_ast", version = "1.0.0" }
oxabl_common = { path = "../oxabl_common", version = "1.1.0" }
oxabl_lexer = { path = "../oxabl_lexer", version = "1.0.1" }
oxabl_workspace = { path = "../oxabl_workspace", version = "1.0.2" }
rustc-hash = "2"

[features]
# Loader-built schema fixtures shared by downstream test suites.
test-support = []

[dev-dependencies]
criterion = { version = "4.3.0", package = "codspeed-criterion-compat" }
tempfile = "3"

[[bench]]
name = "schema_bench"
harness = false
