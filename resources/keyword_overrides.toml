# =============================================================================
# Keywords
# Specific keywords we don't want or are missing from our files
# =============================================================================

# Disp is both a keyword (same as DISPLAY) and an abbreviation of DISPLAY
[[remove]]
name = "disp"
keyword_type = "Statement"

# Prev for Find Prev is missing from our keyword index
[[add]]
name = "prev"
keyword_type = "Statement"

# Procedure is, for some reason, not in our keyword file.
[[add]]
name = "procedure"
keyword_type = "Statement"

# =============================================================================
# Lock Types
# no-lock, share-lock, exclusive-lock
# =============================================================================

# The keyword file defines no lock, exclusive lock, and share lock very poorly.
# Remove the space-separated forms and the "no" entry (which has wrong abbreviation).
# Override hyphenated forms to have no abbreviations - they must be exact matches.
# Space-separated forms will be handled by lexer lookahead.
[[remove]]
name = "share lock"
keyword_type = "Statement"

[[remove]]
name = "exclusive lock"
keyword_type = "Statement"

[[remove]]
name = "no"
keyword_type = "Statement"

# Override lock types to require exact match (no abbreviation)
# share-lock and no-lock exist in reserved keywords, so override their abbreviations
[[override]]
name = "share-lock"
min_abbreviation = "share-lock"

[[override]]
name = "no-lock"
min_abbreviation = "no-lock"

# exclusive-lock doesn't exist (only "exclusive lock" space form), so add it
[[add]]
name = "exclusive-lock"
keyword_type = "Statement"

# =============================================================================
# PREPROCESSOR
# Unmatched preprocessor variable references like {&variable}
# =============================================================================

[[add]]
name = "preprop"
keyword_type = "Preprocessor"

# =============================================================================
# COMMENT MARKERS
# These are used for comments but not listed as keywords
# =============================================================================

[[add]]
name = "//"
reserved = true
keyword_type = "Operator"
min_abbreviation = ""

[[add]]
name = "/*"
reserved = true
keyword_type = "Operator"

[[add]]
name = "*/"
reserved = true
keyword_type = "Operator"

# =============================================================================
# LOCK TYPE ALTERNATE FORMS
# ABL allows both space and hyphen forms for lock types
# =============================================================================

# EXCLUSIVE-LOCK is in reserved keywords as "EXCLUSIVE LOCK" (space)
# Add the hyphenated form
# [[add]]
# name = "EXCLUSIVE-LOCK"
# reserved = true
# keyword_type = "Option"
# min_abbreviation = "EXCLUSIVE-"

# # NO-LOCK is in reserved keywords as "NO-LOCK" (hyphen)
# # Add the space-separated form
# [[add]]
# name = "NO LOCK"
# reserved = true
# keyword_type = "Option"

# # SHARE-LOCK is in reserved keywords as "SHARE-LOCK" (hyphen)
# # Add the space-separated form
# [[add]]
# name = "SHARE LOCK"
# reserved = true
# keyword_type = "Option"
# min_abbreviation = "SHARE"

