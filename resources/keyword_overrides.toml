[[add]]
name = "("
keyword_type = "Punctuation"

[[add]]
name = ")"
keyword_type = "Punctuation"

[[add]]
name = "{"
keyword_type = "Punctuation"

[[add]]
name = "}"
keyword_type = "Punctuation"

[[add]]
