# =============================================================================
# Keywords
# Specific keywords we don't want or are missing from our files
# =============================================================================

# Disp is both a keyword (same as DISPLAY) and an abbreviation of DISPLAY
[[remove]]
name = "disp"
keyword_type = "Statement"

# Term is both a keyword (same as TERMINAL) and an abbreviation of TERMINAL.
# Removing the standalone entry lets TERMINAL's prefix expansion claim "term",
# so `TERM` lexes as Kind::Terminal instead of an unusable Kind::Term.
[[remove]]
name = "term"

# Prev for Find Prev is missing from our keyword index
[[add]]
name = "prev"
keyword_type = "Statement"

# Procedure is, for some reason, not in our keyword file.
[[add]]
name = "procedure"
keyword_type = "Statement"

# =============================================================================
# Lock Types
# no-lock, share-lock, exclusive-lock
# =============================================================================

# The keyword file defines no lock, exclusive lock, and share lock very poorly.
# Remove the space-separated forms. Bare NO stays a keyword (Kind::No) so it
# can serve as the boolean literal (`ttRec.Flag = no.`); the lexer's
# space-separated lock lookahead runs *before* keyword matching, so `NO LOCK`
# still lexes as Kind::NoLock.
# Override hyphenated forms to have no abbreviations - they must be exact matches.
# Space-separated forms will be handled by lexer lookahead.
[[remove]]
name = "share lock"
keyword_type = "Statement"

[[remove]]
name = "exclusive lock"
keyword_type = "Statement"

# Override lock types to require exact match (no abbreviation)
# share-lock and no-lock exist in reserved keywords, so override their abbreviations
[[override]]
name = "share-lock"
min_abbreviation = "share-lock"

[[override]]
name = "no-lock"
min_abbreviation = "no-lock"

# exclusive-lock doesn't exist (only "exclusive lock" space form), so add it.
# min_abbreviation = "EXCLUSIVE" allows `exclusive` alone as abbreviation (ABL-standard).
[[add]]
name = "exclusive-lock"
keyword_type = "Statement"
min_abbreviation = "EXCLUSIVE"

