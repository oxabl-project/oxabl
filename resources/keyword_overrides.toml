keyword_type = "Operator"

[[add]]
name = "CONTAINS"
reserved = true
keyword_type = "Operator"

[[add]]
name = "MODULO"
reserved = true
keyword_type = "Operator"
min_abbreviation = "MOD"

[[add]]
name = ">="
reserved = true
keyword_type = "Operator"

[[add]]
name = "<="
reserved = true
keyword_type = "Operator"

[[add]]
name = "<>"
reserved = true
keyword_type = "Operator"

[[add]]
name = "+="
